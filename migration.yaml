trigger: none

pool:
  name: 'Batch13pool'
  demands:
  - Agent.Name -equals akagent2

variables:
  # Azure
  azureServiceConnection: 'batch13-serviceconnection'
  storageAccount: 'akstgacc'
  storageContainer: 'adocont'

  # SonarQube
  sonarQubeConnection: 'Sonarqubeconnection-ado-new'
  sonarProjectKey: 'Akshata-sq'
  sonarProjectName: 'Akshata-sq'

  # Repository directories
  BACKEND_DIR: 'backend'
  FRONTEND_DIR: 'frontend'
  ELECTRON_DIR: 'electron'
  TERRAFORM_DIR: 'Terraform'

steps:

# =====================================================
# 1. CHECKOUT
# =====================================================

- checkout: self
  clean: true
  displayName: 'Checkout Repository'


# =====================================================
# 2. CHECK REQUIRED TOOLS
# =====================================================

- script: |
    echo ===== Checking Required Tools =====
    java -version
    mvn -version
    node --version
    npm --version
    git --version
    C:\gitleaks\gitleaks.exe version
  displayName: 'Check Required Tools'


# =====================================================
# 3. GITLEAKS SECURITY SCAN
# =====================================================

- script: |
    echo ===== Gitleaks Security Scan =====

    C:\gitleaks\gitleaks.exe detect ^
      --source="$(Build.SourcesDirectory)" ^
      --config="$(Build.SourcesDirectory)\.gitleaks.toml" ^
      --verbose

  displayName: 'Security Scan - Gitleaks'


# =====================================================
# 4. BACKEND UNIT TESTS
# =====================================================

- script: |
    echo ===== Running Backend Unit Tests =====
    mvn test
  workingDirectory: '$(BACKEND_DIR)'
  displayName: 'Test Backend'


# =====================================================
# 5. BUILD BACKEND
# =====================================================

- script: |
    echo ===== Building Spring Boot Backend =====

    mvn clean package -DskipTests

    echo ===== Copying Maven Dependencies =====

    mvn dependency:copy-dependencies ^
      -DoutputDirectory=target/dependency

  workingDirectory: '$(BACKEND_DIR)'
  displayName: 'Build Backend'


# =====================================================
# 6. VERIFY JAVA BUILD OUTPUT
# =====================================================

- powershell: |
    Write-Host "===== Verifying Compiled Java Classes ====="

    $classesPath = "$(Build.SourcesDirectory)\backend\target\classes"
    $dependencyPath = "$(Build.SourcesDirectory)\backend\target\dependency"

    Write-Host "Classes path: $classesPath"
    Write-Host "Dependencies path: $dependencyPath"

    if (!(Test-Path $classesPath)) {
        Write-Error "Compiled classes directory does not exist: $classesPath"
        exit 1
    }

    $classFiles = Get-ChildItem `
      -Path $classesPath `
      -Filter *.class `
      -Recurse `
      -ErrorAction SilentlyContinue

    if ($classFiles.Count -eq 0) {
        Write-Error "No .class files were found under $classesPath"
        exit 1
    }

    Write-Host "Found $($classFiles.Count) compiled .class files."

    $classFiles |
      Select-Object -First 20 |
      ForEach-Object {
        Write-Host $_.FullName
      }

    if (Test-Path $dependencyPath) {
        $jars = Get-ChildItem `
          -Path $dependencyPath `
          -Filter *.jar `
          -ErrorAction SilentlyContinue

        Write-Host "Found $($jars.Count) dependency JAR files."
    }
    else {
        Write-Warning "Dependency directory not found."
    }

  displayName: 'Verify Java Build Output'


# =====================================================
# 7. BUILD FRONTEND
# =====================================================

- script: |
    echo ===== Building React Frontend =====
    call npm install
    call npm run build
  workingDirectory: '$(FRONTEND_DIR)'
  displayName: 'Build Frontend'


# =====================================================
# 8. SONARQUBE PREPARE
# =====================================================

- task: SonarQubePrepare@7
  displayName: 'Prepare SonarQube Analysis'
  inputs:
    SonarQube: '$(sonarQubeConnection)'
    scannerMode: 'cli'
    configMode: 'manual'
    cliProjectKey: '$(sonarProjectKey)'
    cliProjectName: '$(sonarProjectName)'
    cliSources: '.'
    extraProperties: |
      sonar.sources=backend/src,frontend/src
      sonar.java.binaries=$(Build.SourcesDirectory)/backend/target/classes
      sonar.java.libraries=$(Build.SourcesDirectory)/backend/target/dependency/*.jar


# =====================================================
# 9. SONARQUBE ANALYSIS
# =====================================================

- task: SonarQubeAnalyze@7
  displayName: 'Run SonarQube Analysis'


# =====================================================
# 10. SONARQUBE QUALITY GATE
# =====================================================

- task: SonarQubePublish@7
  displayName: 'Publish SonarQube Quality Gate'
  inputs:
    pollingTimeoutSec: '600'


# =====================================================
# 11. PREPARE BUILD ARTIFACT
# =====================================================

- task: CopyFiles@2
  displayName: 'Prepare Build Artifact'
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)'
    Contents: |
      **/*
      !**/.git/**
      !**/node_modules/**
    TargetFolder: '$(Build.ArtifactStagingDirectory)'


# =====================================================
# 12. PUBLISH PIPELINE ARTIFACT
# =====================================================

- task: PublishPipelineArtifact@1
  displayName: 'Publish Build Artifact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)'
    artifact: 'drop'
    publishLocation: 'pipeline'


# =====================================================
# 13. UPLOAD ARTIFACT TO AZURE STORAGE
# =====================================================

- task: AzureCLI@2
  displayName: 'Upload Artifact to Azure Storage'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'batch'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo ===== Uploading Artifact to Azure Storage =====

      az storage blob upload-batch ^
        --account-name "$(storageAccount)" ^
        --destination "$(storageContainer)" ^
        --source "$(Build.ArtifactStagingDirectory)" ^
        --auth-mode login ^
        --overwrite


# =====================================================
# 14. VERIFY AZURE STORAGE
# =====================================================

- task: AzureCLI@2
  displayName: 'Verify Azure Storage Upload'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: 'batch'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo ===== Verifying Azure Blob Storage =====

      az storage blob list ^
        --account-name "$(storageAccount)" ^
        --container-name "$(storageContainer)" ^
        --auth-mode login ^
        --output table


# =====================================================
# 15. SUCCESS
# =====================================================

- script: |
    echo ==========================================
    echo Pipeline Completed Successfully
    echo ==========================================
  displayName: 'Pipeline Success'
  condition: succeeded()